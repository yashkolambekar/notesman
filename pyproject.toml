[project]
name = "notesman"
version = "0.1.0"
description = "Syllabus-aware answer machine for exam papers"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "cryptography>=43",
  "qdrant-client>=1.12",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.32.0",
  "alembic>=1.20.1",
  "authlib>=1.9.8",
  "itsdangerous>=2.2.0",
  "boto3>=1.44.3",
  "python-multipart>=0.0.34",
  "pymupdf4llm>=2.1",
  "markitdown[docx,pptx]>=0.1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notesman"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
